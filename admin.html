<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WP · Admin Panel</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    background: #1a1d21;
    color: #e6e6e6;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 14px;
    background: #11141a;
    border-bottom: 1px solid #2a2f38;
  }
  header .title { font-weight: 700; letter-spacing: .5px; font-size: 15px; color: #fff; }
  header .phase-lbl {
    background: #243042; color: #8fc0ff; padding: 3px 10px; border-radius: 4px;
    font-weight: 600; font-size: 12px;
  }
  header .saved { font-size: 11px; color: #5fc77a; margin-left: auto; opacity: .35; transition: opacity .2s; }
  header .saved.show { opacity: 1; }
  header .reveal-btn {
    background: #c8472b; color: #fff; border: none; padding: 7px 18px; border-radius: 5px;
    font-weight: 700; font-size: 13px; cursor: pointer;
  }
  header .reveal-btn:disabled { background: #3a3f48; color: #777; cursor: not-allowed; }
  header .hdr-actions { display: flex; align-items: center; gap: 6px; }
  .hdr-btn {
    background: #1f2530; color: #cfd6df; border: 1px solid #333a44; padding: 6px 10px;
    border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .hdr-btn:hover { background: #283041; }
  .hdr-btn.hdr-reset { color: #c98a8a; border-color: #4a3030; }
  .hdr-btn.hdr-reset:hover { background: #341e1e; }

  .hotkey-help {
    position: fixed; top: 46px; right: 12px; z-index: 50;
    background: #11141a; border: 1px solid #3a4150; border-radius: 6px;
    padding: 10px 14px; font-size: 12px; color: #cfd6df; box-shadow: 0 6px 24px rgba(0,0,0,.5);
    display: flex; flex-direction: column; gap: 4px;
  }
  .hotkey-help[hidden] { display: none; }
  .hotkey-help b { color: #8fc0ff; margin-bottom: 2px; }
  .hotkey-help kbd {
    background: #222831; border: 1px solid #3a4150; border-radius: 3px;
    padding: 1px 5px; font-size: 11px; font-family: inherit;
  }

  /* BODY GRID */
  .body { display: grid; grid-template-columns: 130px 1fr 340px; height: 100%; overflow: hidden; }

  /* SWITCHER */
  .switcher {
    background: #14171d; border-right: 1px solid #2a2f38; padding: 8px 6px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
  }
  .switcher button {
    width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    color: #b8b8b8; padding: 7px 9px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .switcher button:hover { background: #1f242c; }
  .switcher button.active { background: #243042; color: #8fc0ff; border-color: #335; }
  .switcher button.locked-dot::after { content: " ●"; color: #5fc77a; font-size: 10px; }

  /* MAIN */
  .main { padding: 10px 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

  .info-panel {
    background: #14171d; border: 1px solid #2a2f38; border-radius: 6px; padding: 8px 12px;
    display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center;
  }
  .info-panel .pill { font-size: 12px; }
  .info-panel .pill b { color: #8fc0ff; }
  .info-panel .opts { color: #d0d0d0; font-size: 12px; }
  .info-panel .opts code { background: #222831; padding: 1px 5px; border-radius: 3px; margin-right: 4px; color: #ffd479; }

  /* GRID TIM */
  table.grid { width: 100%; border-collapse: collapse; }
  table.grid th {
    text-align: left; font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase;
    padding: 4px 6px; border-bottom: 1px solid #2a2f38; letter-spacing: .4px;
  }
  table.grid td { padding: 4px 6px; border-bottom: 1px solid #20242b; vertical-align: middle; }
  table.grid input[type=text], table.grid input[type=number], table.grid select {
    background: #1d2128; border: 1px solid #333a44; color: #e6e6e6; border-radius: 4px;
    padding: 5px 7px; font-size: 13px; width: 100%;
  }
  table.grid input[type=number] { width: 80px; }
  table.grid select { cursor: pointer; }
  table.grid .name-cell { width: 150px; }
  table.grid .total { font-size: 11px; color: #777; white-space: nowrap; }
  table.grid .total b { color: #c9d4e0; }

  .status-cell { font-size: 11px; white-space: normal; min-width: 230px; }
  .score-line { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .bank-instr { font-size: 11px; margin-top: 2px; line-height: 1.3; }
  .instr-pay { color: #6fd989; }
  .instr-lose { color: #ff7d6d; }
  .instr-neutral { color: #d4d479; }
  .instr-skip { color: #999; }
  .status-ok { color: #5fc77a; }
  .status-warn { color: #ffce5a; }
  .status-err { color: #ff6b5a; }
  tr.row-err input[type=number] { border-color: #ff6b5a; background: #2a1a18; }
  tr.row-warn input[type=number] { border-color: #ffce5a; }
  tr.row-locked { opacity: .85; }
  tr.row-locked input, tr.row-locked select { background: #181b21; color: #9aa3ad; }

  .lock-btn {
    background: #2f6b3a; color: #fff; border: none; padding: 5px 12px; border-radius: 4px;
    font-size: 12px; font-weight: 600; cursor: pointer; min-width: 64px;
  }
  .lock-btn.unlock { background: #5a4520; color: #ffd479; }
  .lock-btn:disabled { background: #3a3f48; color: #777; cursor: not-allowed; }

  .grid-footer { font-size: 12px; color: #aaa; padding: 4px 6px; }
  .grid-footer b { color: #5fc77a; }

  /* TRIO toggle */
  .trio-wrap { display: flex; flex-wrap: wrap; gap: 4px; max-width: 420px; }
  .trio-btn {
    background: #1d2128; border: 1px solid #333a44; color: #cfd6df;
    padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .trio-btn:hover:not(:disabled) { border-color: #4a5566; }
  .trio-btn.on { background: #1e3a4f; border-color: #4f8fcf; color: #aee0ff; font-weight: 700; }
  .trio-btn:disabled { opacity: .6; cursor: not-allowed; }

  /* ALOKASI inputs */
  .alok-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .alok-slot { display: flex; flex-direction: column; gap: 2px; }
  .alok-lbl { font-size: 10px; color: #8a93a0; white-space: nowrap; }
  table.grid .alok-slot input[type=number] { width: 60px; }
  .alok-total { font-size: 12px; font-weight: 700; white-space: nowrap; }
  .alok-total.ok   { color: #5fc77a; }
  .alok-total.warn { color: #ffce5a; }
  .alok-total.err  { color: #ff6b5a; }

  /* REVEAL PANEL */
  .reveal-panel { background: #14171d; border: 1px solid #2a2f38; border-radius: 6px; padding: 10px 14px; }
  .reveal-panel h3 { margin: 0 0 8px; font-size: 13px; color: #8fc0ff; }
  table.res { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  table.res th { text-align: left; font-size: 11px; color: #888; padding: 3px 8px; border-bottom: 1px solid #2a2f38; }
  table.res td { padding: 3px 8px; border-bottom: 1px solid #20242b; font-size: 13px; }
  table.res td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 700; }
  .b-win { background: #1e3a26; color: #6fd989; }
  .b-lose { background: #3a1e1c; color: #ff7d6d; }
  .b-neutral { background: #2a2f1c; color: #d4d479; }
  .b-skip { background: #2a2d33; color: #999; }
  .net-pos { color: #6fd989; }
  .net-neg { color: #ff7d6d; }
  .net-zero { color: #999; }
  .banker { background: #11150f; border: 1px solid #2f4a2f; border-radius: 6px; padding: 10px 14px; }
  .banker h3 { margin: 0 0 8px; font-size: 13px; color: #6fd989; }
  .banker .pay-line { font-size: 14px; padding: 3px 0; font-variant-numeric: tabular-nums; }
  .banker .pay-line b { color: #ffd479; }
  .banker .none { color: #777; font-size: 12px; }
  .close-reveal { float: right; background: #333a44; color: #ccc; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }

  /* LEADERBOARD (Phase 3) */
  .leaderboard {
    background: #11141a; border-left: 1px solid #2a2f38; padding: 10px 12px;
    overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }
  .lb-title { margin: 0; font-size: 14px; color: #cfd6df; letter-spacing: .4px; }
  .lb-title.final { color: #ffd479; font-size: 15px; }
  .lb-sub { font-size: 11px; color: #8a93a0; }
  .lb-note { font-size: 10px; color: #6a7280; line-height: 1.4; margin-top: 2px; }

  .champs { display: flex; flex-direction: column; gap: 5px; }
  .champ {
    background: #181c23; border: 1px solid #2a2f38; border-radius: 6px; padding: 6px 10px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .champ-1 { border-color: #b8902f; background: #221d10; }
  .champ-2 { border-color: #7a8493; }
  .champ-3 { border-color: #6b4a2f; }
  .champ-gelar { font-size: 12px; font-weight: 700; color: #e6e6e6; white-space: nowrap; }
  .champ-nama { font-size: 13px; color: #fff; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .champ-skor { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }

  table.lb-table { width: 100%; border-collapse: collapse; }
  table.lb-table th {
    text-align: left; font-size: 10px; color: #888; font-weight: 600; text-transform: uppercase;
    padding: 4px 6px; border-bottom: 1px solid #2a2f38;
  }
  table.lb-table td { padding: 4px 6px; border-bottom: 1px solid #20242b; font-size: 12px; }
  table.lb-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .lb-rank { color: #8a93a0; font-weight: 700; width: 22px; }
  .lb-nama { color: #e6e6e6; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-kas { color: #c9d4e0; }
  .lb-sn { width: 20px; text-align: center; }
  .sn-flag { color: #ffce5a; cursor: help; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="title">WP · ADMIN PANEL</span>
    <span class="phase-lbl" id="phaseLbl">—</span>
    <span class="saved" id="savedInd">Tersimpan ✓</span>
    <div class="hdr-actions">
      <button class="hdr-btn" id="helpBtn" title="Daftar hotkey">?</button>
      <button class="hdr-btn" id="exportJsonBtn" title="Backup penuh ke file JSON (Ctrl+S)">⬇ JSON</button>
      <button class="hdr-btn" id="importJsonBtn" title="Restore dari file JSON">⬆ JSON</button>
      <button class="hdr-btn" id="exportCsvBtn" title="Export audit log ke CSV">⬇ CSV</button>
      <button class="hdr-btn hdr-reset" id="resetBtn" title="Reset semua data (terproteksi)">Reset</button>
      <button class="reveal-btn" id="revealBtn" disabled>REVEAL</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none">
    </div>
  </header>
  <div class="hotkey-help" id="hotkeyHelp" hidden>
    <b>Hotkeys</b>
    <div><kbd>Enter</kbd> lock baris &amp; lompat ke baris berikut</div>
    <div><kbd>Ctrl/⌘</kbd>+<kbd>L</kbd> lock semua baris yang valid</div>
    <div><kbd>Ctrl/⌘</kbd>+<kbd>R</kbd> REVEAL ronde aktif (jika 10 locked)</div>
    <div><kbd>Ctrl/⌘</kbd>+<kbd>S</kbd> Export Backup JSON</div>
    <div><kbd>Tab</kbd> / <kbd>Shift</kbd>+<kbd>Tab</kbd> navigasi field</div>
  </div>
  <div class="body">
    <nav class="switcher" id="switcher"></nav>
    <main class="main" id="main"></main>
    <aside class="leaderboard" id="leaderboard"></aside>
  </div>
</div>

<script>
"use strict";

/* ===================== KONSTANTA ===================== */
const ROUND_CONFIG = {
  R1:    { tipe:'single',  mult:1.0, wagerMin:10, wagerMax:50,  kunci:'B',
           opsi:{A:'Continuation Down', B:'Double Bottom', C:'Sideways'} },
  R2:    { tipe:'single',  mult:1.0, wagerMin:20, wagerMax:100, kunci:'B',
           opsi:{A:'SPYR', B:'NOCT', C:'PRPR', D:'RBBT'} },
  R3:    { tipe:'single',  mult:1.2, wagerMin:20, wagerMax:100, kunci:'A',
           opsi:{A:'SPYR', B:'NOCT', C:'QULL', D:'PRPR'} },
  R4:    { tipe:'alokasi', mult:1.5, wager:100, minSaham:2, maxPerSaham:50, kelipatan:10,
           slot:{A:'SPYR', B:'NOCT', C:'QULL', D:'MIRR', E:'GRIN'},
           outcome:{ SPYR:2.5, NOCT:0.5, QULL:1.0, MIRR:1.5, GRIN:0.5 } },
  R5:    { tipe:'trio',    mult:1.5, wagerMin:30, wagerMax:150, trio:['A','B','C'],
           opsi:{A:'Gold', B:'Cash', C:'Gov Bond', D:'Deposito', E:'Bitcoin', F:'Index'} },
  R6:    { tipe:'trio',    mult:1.8, wagerMin:30, wagerMax:150, trio:['A','B','C'],
           opsi:{A:'CSTR', B:'RBBT', C:'LUMN', D:'SPYR', E:'QULL', F:'MIRR'} },
  R7:    { tipe:'trio',    mult:2.0, wagerMin:30, wagerMax:150, trio:['A','C','E'],
           opsi:{A:'QULL', B:'MIRR', C:'NOCT', D:'SPYR', E:'GRIN', F:'TARO'} },
  R8:    { tipe:'alokasi', mult:2.2, wager:100, minSaham:2, maxPerSaham:50, kelipatan:10,
           slot:{A:'RBBT', B:'GRIN', C:'NOCT', D:'MIRR', E:'SPYR'},
           outcome:{ RBBT:2.5, GRIN:1.5, NOCT:1.0, MIRR:0, SPYR:0 } },
  R9:    { tipe:'alokasi', mult:2.5, wager:100, maxPick:2, kelipatan:10,
           slot:{A:'EVRG', B:'HNPR', C:'LRBK', D:'MRRT'},
           outcome:{ EVRG:2.0, HNPR:1.5, LRBK:1.1, MRRT:0 } },
  BONUS: { tipe:'bonus',   mult:2.5, wagerMin:50, wagerMax:200, kunci:'B',
           opsi:{A:'QULL', B:'NOCT', C:'SPYR', D:'PRPR'}, netral:['A'] },
};

// Phase 3: urutan kronologis ronde (untuk kas berjalan & Safety Net yang berurutan),
// modal awal kas fisik, lantai Safety Net, dan urutan tiebreaker ranking.
const URUTAN_RONDE    = ['R1','R2','R3','R4','R5','R6','R7','R8','R9','BONUS'];
const MODAL_AWAL      = 500;
const SAFETY_FLOOR    = 100;
const URUTAN_TIEBREAK = ['R9','BONUS','R8','R7','R6','R5'];

/* ===================== FUNGSI SCORING (pure) ===================== */
// TIPE 1: SINGLE PICK (R1, R2, R3)
function scoreSingle(pick, wager, cfg) {
  const benar = (pick === cfg.kunci);
  const net   = benar ? +(wager * cfg.mult) : -wager;
  const cash  = benar ?  wager * (1 + cfg.mult) : 0;
  return { status: benar ? 'MENANG' : 'KALAH', net, cash };
}

// TIPE 1b: BONUS (single + opt-out + netral)
// Aturan terkunci: pick 'SKIP' -> net 0, cash 0 (tidak pasang stake).
//                  pick netral (QULL) -> net 0, cash = wager (stake DIKEMBALIKAN).
function scoreBonus(pick, wager, cfg) {
  if (pick === 'SKIP')           return { status:'SKIP',   net:0, cash:0 };
  if (cfg.netral.includes(pick)) return { status:'NETRAL', net:0, cash:wager }; // stake balik
  const benar = (pick === cfg.kunci);
  const net   = benar ? +(wager * cfg.mult) : -wager;
  const cash  = benar ?  wager * (1 + cfg.mult) : 0;
  return { status: benar ? 'MENANG' : 'KALAH', net, cash };
}

// TIPE 2: TRIO 3-of-6 (R5, R6, R7) -- dipakai Phase 2
function scoreTrio(picks, wager, cfg) {
  const cocok = picks.filter(p => cfg.trio.includes(p)).length;
  if (cocok === 3) return { status:'3/3 MENANG', cocok, net:+(wager*cfg.mult), cash:wager*(1+cfg.mult) };
  if (cocok === 2) return { status:'2/3 IMPAS',  cocok, net:0,                 cash:wager }; // stake balik
  return            { status:'KALAH',            cocok, net:-wager,            cash:0 };
}

// TIPE 3: ALOKASI (R4, R8, R9) -- dipakai Phase 2
function scoreAlokasi(alokasi, cfg) {
  let base = 0;
  for (const t in alokasi) base += alokasi[t] * (cfg.outcome[t] || 0);
  const payout = base * cfg.mult;
  const net    = payout - 100;
  return { base, payout, net, cash: payout };
}

// Pembulatan kas fisik (skor presisi tetap disimpan untuk ranking)
const bulatRp5 = (x) => Math.round(x / 5) * 5;

/* ===================== STATE ===================== */
const STORAGE_KEY = 'wp2-state';
const ROUND_KEYS = Object.keys(ROUND_CONFIG);            // R1..R9, BONUS
const NUM_TEAMS = 10;

function defaultState() {
  const teams = [];
  for (let i = 0; i < NUM_TEAMS; i++) teams.push('Tim ' + (i + 1));
  const rounds = {};
  for (const rk of ROUND_KEYS) {
    rounds[rk] = { submissions: [], revealed: false };
    for (let i = 0; i < NUM_TEAMS; i++) {
      rounds[rk].submissions.push({ pick:'', picks:[], alokasi:{}, wager:0, locked:false, status:'', net:0, cash:0, timestamp:null });
    }
  }
  return { teams, rounds, activeRound: 'R1', revealedPhases: [], auditLog: [] };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    // merge defensif supaya tahan terhadap struktur lama
    const d = defaultState();
    d.teams = Array.isArray(parsed.teams) && parsed.teams.length === NUM_TEAMS ? parsed.teams : d.teams;
    if (parsed.rounds) {
      for (const rk of ROUND_KEYS) {
        if (parsed.rounds[rk] && Array.isArray(parsed.rounds[rk].submissions)) {
          d.rounds[rk].revealed = !!parsed.rounds[rk].revealed;
          for (let i = 0; i < NUM_TEAMS; i++) {
            const s = parsed.rounds[rk].submissions[i];
            if (s) d.rounds[rk].submissions[i] = {
              pick: s.pick || '',
              picks: Array.isArray(s.picks) ? s.picks.slice() : [],
              alokasi: (s.alokasi && typeof s.alokasi === 'object') ? Object.assign({}, s.alokasi) : {},
              wager: +s.wager || 0, locked: !!s.locked, status: s.status || '',
              net: +s.net || 0, cash: +s.cash || 0, timestamp: s.timestamp || null
            };
          }
        }
      }
    }
    d.activeRound = ROUND_KEYS.includes(parsed.activeRound) ? parsed.activeRound : 'R1';
    // revealedPhases diturunkan dari flag .revealed agar selalu konsisten & migrasi state lama.
    d.revealedPhases = ROUND_KEYS.filter(rk => d.rounds[rk].revealed);
    d.auditLog = Array.isArray(parsed.auditLog) ? parsed.auditLog : [];
    // Revisi 2 (single source of truth): recompute skor semua submission locked; kosongkan yang tidak.
    for (const rk of ROUND_KEYS) {
      const cfg = ROUND_CONFIG[rk];
      d.rounds[rk].submissions.forEach(sub => {
        if (sub.locked) {
          const r = computeRow(rk, cfg, sub);
          sub.net = r.net; sub.cash = r.cash; sub.status = r.status || '';
        } else {
          sub.net = 0; sub.cash = 0; sub.status = '';
        }
      });
    }
    return d;
  } catch (e) {
    console.warn('Gagal load state, pakai default:', e);
    return defaultState();
  }
}

let saveTimer = null;
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 500);
}
function doSave() {
  saveTimer = null;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    flashSaved();
  } catch (e) { console.warn('Gagal save:', e); }
}
function flashSaved() {
  const el = document.getElementById('savedInd');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 900);
}

/* ===================== AUDIT + LOCK HELPERS (Phase 4) ===================== */
// snapshot nilai lama saat unlock-edit, untuk audit OVERRIDE (lama -> baru). Transient.
const pendingOverride = new Map();

function nowISO() { return new Date().toISOString(); }

function pushAudit(action, phase, team, value) {
  if (!Array.isArray(state.auditLog)) state.auditLog = [];
  state.auditLog.push({
    ts: nowISO(), action, phase: phase || '', team: team || '',
    value: value !== undefined ? value : null
  });
}

// ringkasan submission untuk audit (per tipe ronde)
function subValue(sub, cfg) {
  if (cfg.tipe === 'trio')    return { picks: sub.picks.slice(), wager: sub.wager };
  if (cfg.tipe === 'alokasi') return { alokasi: Object.assign({}, sub.alokasi) };
  return { pick: sub.pick, wager: sub.wager };
}

// Lock 1 baris (validasi dulu). Audit INPUT, atau OVERRIDE bila baris ini sedang siklus edit.
// return true bila berhasil lock. Caller yang save + render.
function lockTeam(rk, i) {
  const cfg = ROUND_CONFIG[rk];
  const sub = state.rounds[rk].submissions[i];
  if (sub.locked) return false;
  if (!validateSubmission(sub, cfg, rk).ok) return false;
  sub.locked = true;
  sub.timestamp = nowISO();
  // Revisi 2: scoring otomatis saat lock (per tim) — simpan hasil ke submission
  const r = computeRow(rk, cfg, sub);
  sub.net = r.net;
  sub.cash = r.cash;
  sub.status = r.status || '';
  const baru = Object.assign({}, subValue(sub, cfg), { status: sub.status, net: sub.net, cash: sub.cash });
  const key = rk + '#' + i;
  if (pendingOverride.has(key)) {
    pushAudit('OVERRIDE', rk, state.teams[i], { lama: pendingOverride.get(key), baru });
    pendingOverride.delete(key);
  } else {
    pushAudit('SCORE', rk, state.teams[i], baru);
  }
  return true;
}

// Unlock 1 baris untuk koreksi. withConfirm = minta konfirmasi operator.
// Membatalkan reveal fase (Phase 3) sehingga REVEAL otomatis disabled lagi. Caller save + render.
function unlockTeam(rk, i, withConfirm) {
  const sub = state.rounds[rk].submissions[i];
  if (!sub.locked) return false;
  if (withConfirm && !confirm(`Buka kunci & edit ulang ${state.teams[i]} di ${rk}?`)) return false;
  const cfg = ROUND_CONFIG[rk];
  // simpan nilai lama (termasuk skor) untuk audit OVERRIDE saat lock ulang
  pendingOverride.set(rk + '#' + i, Object.assign({}, subValue(sub, cfg), { status: sub.status, net: sub.net, cash: sub.cash }));
  // Revisi 2: kosongkan hasil score agar leaderboard berhenti menghitung baris ini
  sub.locked = false;
  sub.net = 0; sub.cash = 0; sub.status = '';
  return true;
}

function lockAllValid() {
  const rk = state.activeRound;
  const cfg = ROUND_CONFIG[rk];
  let any = false;
  state.rounds[rk].submissions.forEach((sub, i) => {
    if (!sub.locked && validateSubmission(sub, cfg, rk).ok && lockTeam(rk, i)) any = true;
  });
  if (any) { scheduleSave(); render(); }
}

// totalScore tim = Σ net presisi dari semua submission tim yang sudah locked+scored
function teamTotalScore(teamIdx) {
  let total = 0;
  for (const rk of ROUND_KEYS) {
    const sub = state.rounds[rk].submissions[teamIdx];
    if (sub && sub.locked) total += sub.net;
  }
  return total;
}

/* ===================== LEADERBOARD (Phase 3) ===================== */
// Recompute dari nol tiap dipanggil. DUA angka terpisah:
//   skorRanking = Σ net PRESISI (resmi, penentu juara; TIDAK terpengaruh Safety Net).
//   kasBerjalan = uang fisik (mulai 500, += bulatRp5(net) per ronde, top-up ke 100 bila < 100).
function hitungLeaderboard(st) {
  const rows = [];

  for (let i = 0; i < NUM_TEAMS; i++) {
    let skorRanking = 0;
    const netPerRonde = {};
    let totalWagerBenar = 0;
    let timestampPertama = null;

    // skorRanking + netPerRonde + totalWagerBenar + timestampPertama
    // sumber data: SEMUA submission tim yang locked+scored (lepas dari revealedPhases)
    for (const fase of URUTAN_RONDE) {
      const sub = st.rounds[fase] && st.rounds[fase].submissions[i];
      if (!sub || !sub.locked) continue;
      const net = sub.net || 0;
      skorRanking += net;
      netPerRonde[fase] = net;
      if (net > 0) {
        const cfg = ROUND_CONFIG[fase];
        totalWagerBenar += (cfg.tipe === 'alokasi') ? 100 : (sub.wager || 0);
      }
      if (sub.timestamp && (timestampPertama === null || sub.timestamp < timestampPertama)) {
        timestampPertama = sub.timestamp;
      }
    }

    // kasBerjalan + Safety Net: iterasi URUTAN_RONDE (berurutan!), hanya submission locked
    let kas = MODAL_AWAL, totalTopup = 0, safetyNetTriggered = false;
    for (const fase of URUTAN_RONDE) {
      const sub = st.rounds[fase] && st.rounds[fase].submissions[i];
      if (!sub || !sub.locked) continue;
      kas += bulatRp5(sub.net || 0);
      if (kas < SAFETY_FLOOR) {
        totalTopup += (SAFETY_FLOOR - kas);
        kas = SAFETY_FLOOR;
        safetyNetTriggered = true;
      }
    }

    rows.push({
      timId: i, nama: st.teams[i], skorRanking, netPerRonde, totalWagerBenar,
      timestampPertama, kasBerjalan: kas, safetyNetTriggered, totalTopup
    });
  }

  // tiebreaker berurutan
  rows.sort((a, b) => {
    if (b.skorRanking !== a.skorRanking) return b.skorRanking - a.skorRanking;
    for (const fase of URUTAN_TIEBREAK) {
      const av = a.netPerRonde[fase] || 0, bv = b.netPerRonde[fase] || 0;
      if (bv !== av) return bv - av;
    }
    if (b.totalWagerBenar !== a.totalWagerBenar) return b.totalWagerBenar - a.totalWagerBenar;
    // timestamp asc: yang lebih dulu lock menang; null (belum lock) ditaruh terakhir
    if (a.timestampPertama === b.timestampPertama) return 0;
    if (a.timestampPertama === null) return 1;
    if (b.timestampPertama === null) return -1;
    return a.timestampPertama < b.timestampPertama ? -1 : 1;
  });

  return rows;
}

/* ===================== HELPER ALOKASI ===================== */
// Jumlah seluruh slot (keyed by ticker) untuk satu submission alokasi.
function sumAlok(sub, cfg) {
  let total = 0;
  for (const letter in cfg.slot) total += +(sub.alokasi[cfg.slot[letter]] || 0);
  return total;
}
// Bangun object alokasi keyed by ticker, hanya slot non-nol (untuk scoreAlokasi).
function buildAlok(sub, cfg) {
  const o = {};
  for (const letter in cfg.slot) {
    const t = cfg.slot[letter];
    const v = +(sub.alokasi[t] || 0);
    if (v) o[t] = v;
  }
  return o;
}

/* ===================== VALIDASI ===================== */
// return {ok, level:'ok'|'warn'|'err', msg}
function validateSubmission(sub, cfg, rk) {
  if (cfg.tipe === 'trio')    return validateTrio(sub, cfg);
  if (cfg.tipe === 'alokasi') return validateAlokasi(sub, cfg);
  const isBonus = cfg.tipe === 'bonus';
  // SKIP pada bonus selalu valid
  if (isBonus && sub.pick === 'SKIP') return { ok:true, level:'ok', msg:'SKIP — wager 0' };

  if (!sub.pick) return { ok:false, level:'err', msg:'Pick wajib dipilih' };

  const w = +sub.wager;
  if (!Number.isFinite(w)) return { ok:false, level:'err', msg:'Wager bukan angka' };
  if (w < cfg.wagerMin || w > cfg.wagerMax)
    return { ok:false, level:'err', msg:`Wager harus ${cfg.wagerMin}–${cfg.wagerMax}` };
  if (w % 5 !== 0) return { ok:false, level:'err', msg:'Wager harus kelipatan 5' };

  // soft warning: floor 20% x wagerMax
  if (w < 0.2 * cfg.wagerMax)
    return { ok:true, level:'warn', msg:`Wager rendah (<${Math.round(0.2*cfg.wagerMax)}) — boleh lock` };

  return { ok:true, level:'ok', msg:'Valid' };
}

// TRIO: harus pilih tepat 3; wager dalam range; soft warning floor 20%.
function validateTrio(sub, cfg) {
  const n = sub.picks.length;
  if (n !== 3) return { ok:false, level:'err', msg:`Pilih tepat 3 (kini ${n})` };
  const w = +sub.wager;
  if (!Number.isFinite(w)) return { ok:false, level:'err', msg:'Wager bukan angka' };
  if (w < cfg.wagerMin || w > cfg.wagerMax)
    return { ok:false, level:'err', msg:`Wager harus ${cfg.wagerMin}–${cfg.wagerMax}` };
  if (w % 5 !== 0) return { ok:false, level:'err', msg:'Wager harus kelipatan 5' };
  if (w < 0.2 * cfg.wagerMax)
    return { ok:true, level:'warn', msg:`Wager rendah (<${Math.round(0.2*cfg.wagerMax)}) — boleh lock` };
  return { ok:true, level:'ok', msg:'Valid (3 dipilih)' };
}

// ALOKASI: total harus = wager(100), kelipatan 10, non-negatif.
//  R4/R8: min saham terisi & maks per saham. R9: maks IPO terisi, total 0 boleh (tidak ikut).
function validateAlokasi(sub, cfg) {
  const isR9 = cfg.maxPick != null;
  let nonzero = 0;
  for (const letter in cfg.slot) {
    const v = +(sub.alokasi[cfg.slot[letter]] || 0);
    if (!Number.isFinite(v) || v < 0) return { ok:false, level:'err', msg:'Ada input negatif/invalid' };
    if (cfg.kelipatan && v % cfg.kelipatan !== 0)
      return { ok:false, level:'err', msg:`Harus kelipatan ${cfg.kelipatan}` };
    if (cfg.maxPerSaham != null && v > cfg.maxPerSaham)
      return { ok:false, level:'err', msg:`Maks ${cfg.maxPerSaham}/saham` };
    if (v > 0) nonzero++;
  }
  const total = sumAlok(sub, cfg);
  if (isR9) {
    if (total === 0) return { ok:true, level:'warn', msg:'Tim tidak ikut, skor 0' };
    if (nonzero > cfg.maxPick) return { ok:false, level:'err', msg:`Maks ${cfg.maxPick} IPO` };
    if (total !== cfg.wager) return { ok:false, level:'err', msg:`Total harus ${cfg.wager} (kini ${total})` };
    return { ok:true, level:'ok', msg:`Total ${total} ✓` };
  }
  if (cfg.minSaham != null && nonzero < cfg.minSaham)
    return { ok:false, level:'err', msg:`Min ${cfg.minSaham} saham terisi` };
  if (total !== cfg.wager) return { ok:false, level:'err', msg:`Total harus ${cfg.wager} (kini ${total})` };
  return { ok:true, level:'ok', msg:`Total ${total} ✓` };
}

function allTeamsLocked(rk) {
  return state.rounds[rk].submissions.every(s => s.locked);
}
function countLocked(rk) {
  return state.rounds[rk].submissions.filter(s => s.locked).length;
}

/* ===================== RENDER ===================== */
const switcherEl = document.getElementById('switcher');
const mainEl = document.getElementById('main');
const leaderboardEl = document.getElementById('leaderboard');
const phaseLblEl = document.getElementById('phaseLbl');
const revealBtn = document.getElementById('revealBtn');

// transient (tidak dipersist): ronde mana yang panel Ringkasan Bankir-nya sedang dibuka.
const summaryShown = new Set();

function phaseLabel(rk) {
  const cfg = ROUND_CONFIG[rk];
  const tipeNama = { single:'Single', bonus:'Bonus', trio:'Trio', alokasi:'Alokasi' }[cfg.tipe];
  return `${rk} · ${tipeNama} ×${cfg.mult}`;
}

function renderSwitcher() {
  switcherEl.innerHTML = '';
  for (const rk of ROUND_KEYS) {
    const btn = document.createElement('button');
    btn.textContent = rk;
    if (rk === state.activeRound) btn.classList.add('active');
    if (allTeamsLocked(rk)) btn.classList.add('locked-dot');
    btn.onclick = () => { state.activeRound = rk; scheduleSave(); render(); };
    switcherEl.appendChild(btn);
  }
}

function render() {
  const rk = state.activeRound;
  const cfg = ROUND_CONFIG[rk];
  phaseLblEl.textContent = phaseLabel(rk);
  renderSwitcher();

  // REVEAL non-gating: bisa diklik kapan saja untuk menampilkan ringkasan Bankir ronde aktif
  revealBtn.disabled = false;
  revealBtn.textContent = summaryShown.has(rk) ? 'REVEAL ✓' : 'REVEAL';
  revealBtn.onclick = () => toggleSummary(rk);

  mainEl.innerHTML = '';
  mainEl.appendChild(renderInfoPanel(cfg));
  mainEl.appendChild(renderGrid(rk, cfg));
  mainEl.appendChild(renderFooter(rk));
  if (summaryShown.has(rk)) mainEl.appendChild(renderSummary(rk, cfg));

  renderLeaderboard();
}

function renderInfoPanel(cfg) {
  const p = document.createElement('div');
  p.className = 'info-panel';
  const tipeNama = {
    single:'Single Pick', bonus:'Bonus (opt-out + netral)', trio:'Trio (3-of-6)', alokasi:'Alokasi (stake 100)'
  }[cfg.tipe] || cfg.tipe;
  let html = `<span class="pill">Tipe: <b>${tipeNama}</b></span>`;
  html += `<span class="pill">Multiplier: <b>×${cfg.mult}</b></span>`;

  if (cfg.tipe === 'alokasi') {
    html += `<span class="pill">Stake: <b>${cfg.wager}</b></span>`;
    if (cfg.kelipatan != null)   html += `<span class="pill">Kelipatan: <b>${cfg.kelipatan}</b></span>`;
    if (cfg.minSaham != null)    html += `<span class="pill">Min saham: <b>${cfg.minSaham}</b></span>`;
    if (cfg.maxPerSaham != null) html += `<span class="pill">Maks/saham: <b>${cfg.maxPerSaham}</b></span>`;
    if (cfg.maxPick != null)     html += `<span class="pill">Maks pick: <b>${cfg.maxPick}</b></span>`;
    let opts = '<span class="opts">';
    for (const k in cfg.slot) opts += `<code>${k}=${cfg.slot[k]} ×${cfg.outcome[cfg.slot[k]]}</code>`;
    opts += '</span>';
    p.innerHTML = html + opts;
    return p;
  }

  html += `<span class="pill">Wager: <b>${cfg.wagerMin}–${cfg.wagerMax}</b></span>`;
  if (cfg.tipe === 'trio') {
    html += `<span class="pill">Kunci: <b>${cfg.trio.join('+')}</b></span>`;
  } else {
    html += `<span class="pill">Kunci: <b>${cfg.kunci}</b></span>`;
    if (cfg.tipe === 'bonus') html += `<span class="pill">Netral: <b>${cfg.netral.join(',')}</b></span>`;
  }
  let opts = '<span class="opts">';
  for (const k in cfg.opsi) opts += `<code>${k}=${cfg.opsi[k]}</code>`;
  opts += '</span>';
  p.innerHTML = html + opts;
  return p;
}

function renderGrid(rk, cfg) {
  const table = document.createElement('table');
  table.className = 'grid';
  const tipe = cfg.tipe;
  const isBonus = tipe === 'bonus';
  const isTrio  = tipe === 'trio';
  const isAlok  = tipe === 'alokasi';

  const pickHdr  = isTrio ? 'Pilih 3 (A–F)' : isAlok ? 'Alokasi per slot' : 'Pick';
  const wagerHdr = isAlok ? 'Total' : 'Wager';
  table.innerHTML = `<thead><tr>
    <th>#</th><th>Nama Tim</th><th>${pickHdr}</th><th>${wagerHdr}</th><th>Status</th><th>Aksi</th><th>Total</th>
  </tr></thead>`;
  const tbody = document.createElement('tbody');

  state.rounds[rk].submissions.forEach((sub, i) => {
    const tr = document.createElement('tr');
    tr.dataset.team = i;
    if (sub.locked) tr.classList.add('row-locked');

    // late-bound: handler input angka memanggil refreshRow() (di-assign di bawah)
    let refreshRow = () => {};
    let totalSpan = null;

    // #
    const tdNum = document.createElement('td'); tdNum.textContent = (i+1); tr.appendChild(tdNum);

    // Nama tim
    const tdName = document.createElement('td'); tdName.className = 'name-cell';
    const nameInput = document.createElement('input');
    nameInput.type = 'text'; nameInput.value = state.teams[i];
    nameInput.oninput = () => { state.teams[i] = nameInput.value; scheduleSave(); };
    tdName.appendChild(nameInput); tr.appendChild(tdName);

    // ---------- Pick cell (per tipe) ----------
    const tdPick = document.createElement('td');
    if (isTrio) {
      const wrapT = document.createElement('div'); wrapT.className = 'trio-wrap';
      for (const letter in cfg.opsi) {
        const btn = document.createElement('button');
        btn.className = 'trio-btn' + (sub.picks.includes(letter) ? ' on' : '');
        btn.textContent = `${letter} · ${cfg.opsi[letter]}`;
        btn.disabled = sub.locked;
        btn.onclick = () => {
          const idx = sub.picks.indexOf(letter);
          if (idx >= 0) sub.picks.splice(idx, 1);
          else if (sub.picks.length >= 3) return;   // tolak pilihan ke-4 (tidak auto-ganti)
          else sub.picks.push(letter);
          scheduleSave(); render();
        };
        wrapT.appendChild(btn);
      }
      tdPick.appendChild(wrapT);
    } else if (isAlok) {
      const wrapA = document.createElement('div'); wrapA.className = 'alok-wrap';
      for (const letter in cfg.slot) {
        const ticker = cfg.slot[letter];
        const slotEl = document.createElement('label'); slotEl.className = 'alok-slot';
        const lbl = document.createElement('span'); lbl.className = 'alok-lbl';
        lbl.textContent = `${letter} · ${ticker}`;
        const inp = document.createElement('input');
        inp.type = 'number'; inp.min = 0; inp.step = cfg.kelipatan || 1;
        inp.value = sub.alokasi[ticker] != null ? sub.alokasi[ticker] : 0;
        inp.disabled = sub.locked;
        inp.oninput = () => {
          sub.alokasi[ticker] = inp.value === '' ? 0 : +inp.value;
          scheduleSave(); refreshRow();
        };
        slotEl.appendChild(lbl); slotEl.appendChild(inp);
        wrapA.appendChild(slotEl);
      }
      tdPick.appendChild(wrapA);
    } else {
      const sel = document.createElement('select');
      sel.disabled = sub.locked;
      const blank = document.createElement('option'); blank.value=''; blank.textContent='— pilih —'; sel.appendChild(blank);
      for (const k in cfg.opsi) {
        const o = document.createElement('option'); o.value = k; o.textContent = `${k} (${cfg.opsi[k]})`; sel.appendChild(o);
      }
      if (isBonus) { const o = document.createElement('option'); o.value='SKIP'; o.textContent='SKIP'; sel.appendChild(o); }
      sel.value = sub.pick;
      sel.onchange = () => {
        sub.pick = sel.value;
        if (isBonus && sub.pick === 'SKIP') { sub.wager = 0; }
        scheduleSave(); render();
      };
      tdPick.appendChild(sel);
    }
    tr.appendChild(tdPick);

    // ---------- Wager / Total cell ----------
    const tdWager = document.createElement('td');
    if (isAlok) {
      totalSpan = document.createElement('span');
      tdWager.appendChild(totalSpan);   // diisi oleh refreshRow()
    } else {
      const wInput = document.createElement('input');
      wInput.type = 'number'; wInput.value = sub.wager;
      wInput.min = cfg.wagerMin; wInput.max = cfg.wagerMax; wInput.step = 5;   // wager kelipatan 5 (range tetap)
      wInput.disabled = sub.locked || (isBonus && sub.pick === 'SKIP');
      wInput.oninput = () => {
        sub.wager = wInput.value === '' ? 0 : +wInput.value;
        scheduleSave(); refreshRow();
      };
      tdWager.appendChild(wInput);
    }
    tr.appendChild(tdWager);

    // ---------- Status ----------
    const tdStatus = document.createElement('td');
    tdStatus.className = 'status-cell';
    tr.appendChild(tdStatus);

    // ---------- Aksi (lock/unlock) ----------
    const tdAct = document.createElement('td');
    const lockBtn = document.createElement('button');
    lockBtn.className = 'lock-btn' + (sub.locked ? ' unlock' : '');
    lockBtn.textContent = sub.locked ? 'Unlock/Edit' : 'LOCK';
    lockBtn.onclick = () => {
      const ok = sub.locked ? unlockTeam(rk, i, true) : lockTeam(rk, i);
      if (ok) { scheduleSave(); render(); }
    };
    tdAct.appendChild(lockBtn); tr.appendChild(tdAct);

    // ---------- Total skor (akumulasi lintas ronde, net presisi) ----------
    const tdTotal = document.createElement('td');
    tdTotal.className = 'total';
    tdTotal.innerHTML = `Σ <b>${fmtNet(teamTotalScore(i))}</b>`;
    tr.appendChild(tdTotal);

    // refresh ringan: update validasi/status tanpa rebuild input (caret aman)
    refreshRow = () => {
      if (sub.locked) {
        // Revisi 2: tampilkan hasil score inline (badge + net presisi + instruksi Bankir)
        tr.classList.remove('row-err', 'row-warn');
        const bl = bankerLine(rk, cfg, sub, state.teams[i]);
        tdStatus.innerHTML = `<div class="score-line">${statusBadge(bl.badge)} ${fmtNet(bl.r.net)}</div>` +
          `<div class="bank-instr ${bl.klass}">${escapeHtml(bl.instr)}</div>`;
        lockBtn.disabled = false;
      } else {
        const v = validateSubmission(sub, cfg, rk);
        tr.classList.toggle('row-err',  v.level === 'err');
        tr.classList.toggle('row-warn', v.level === 'warn');
        const cls = v.level==='err' ? 'status-err' : v.level==='warn' ? 'status-warn' : 'status-ok';
        tdStatus.innerHTML = `<span class="${cls}">${v.msg}</span>`;
        lockBtn.disabled = !v.ok;
      }
      if (isAlok && totalSpan) {
        const total = sumAlok(sub, cfg);
        if (total === cfg.wager) { totalSpan.className = 'alok-total ok';  totalSpan.textContent = `Total: ${total} ✓`; }
        else if (cfg.maxPick != null && total === 0) { totalSpan.className = 'alok-total warn'; totalSpan.textContent = 'Total: 0 (tidak ikut)'; }
        else { totalSpan.className = 'alok-total err'; totalSpan.textContent = `Total: ${total} ✗`; }
      }
    };
    refreshRow();  // initial paint

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  return table;
}

function renderFooter(rk) {
  const f = document.createElement('div');
  f.className = 'grid-footer';
  const n = countLocked(rk);
  f.innerHTML = `<b>${n}</b> / ${NUM_TEAMS} locked`;
  return f;
}

/* ===================== REVEAL ===================== */
function computeRow(rk, cfg, sub) {
  if (cfg.tipe === 'single') return scoreSingle(sub.pick, sub.wager, cfg);
  if (cfg.tipe === 'bonus')  return scoreBonus(sub.pick, sub.wager, cfg);
  if (cfg.tipe === 'trio')   return scoreTrio(sub.picks, sub.wager, cfg);
  if (cfg.tipe === 'alokasi') {
    // EDGE CASE R9: total 0 = tim tidak ikut -> JANGAN panggil scoreAlokasi (akan beri net -100).
    if (cfg.maxPick != null && sumAlok(sub, cfg) === 0)
      return { status:'TIDAK IKUT', net:0, cash:0, base:0, payout:0 };
    return scoreAlokasi(buildAlok(sub, cfg), cfg);
  }
  return { status:'-', net:0, cash:0 };
}

// Revisi 2: REVEAL kini NON-GATING — toggle panel Ringkasan Bankir ronde aktif (tak menghitung apa pun).
function toggleSummary(rk) {
  if (summaryShown.has(rk)) {
    summaryShown.delete(rk);
  } else {
    summaryShown.add(rk);
    pushAudit('REVEAL', rk, 'ALL', { terlock: countLocked(rk) });
  }
  render();
}

function statusBadge(status) {
  if (status.includes('MENANG')) return `<span class="badge b-win">${status}</span>`;
  if (status === 'PAYOUT')       return '<span class="badge b-win">PAYOUT</span>';
  if (status === 'KALAH')        return '<span class="badge b-lose">KALAH</span>';
  if (status === 'HANGUS')       return '<span class="badge b-lose">HANGUS</span>';
  if (status.includes('IMPAS'))  return `<span class="badge b-neutral">${status}</span>`;
  if (status === 'NETRAL')       return '<span class="badge b-neutral">NETRAL</span>';
  if (status === 'SKIP')         return '<span class="badge b-skip">SKIP</span>';
  if (status === 'TIDAK IKUT')   return '<span class="badge b-skip">TIDAK IKUT</span>';
  return `<span class="badge b-skip">${status}</span>`;
}

// angka presisi sebagai teks polos (untuk disisipkan ke instruksi)
function numStr(n) { return Number.isInteger(n) ? String(n) : n.toFixed(2); }

// Instruksi Bankir (STAKE MODEL) + badge untuk satu submission. Dipakai inline & di Ringkasan.
function bankerLine(rk, cfg, sub, nama) {
  const r = computeRow(rk, cfg, sub);
  let instr, klass, badge;
  if (r.status === 'TIDAK IKUT') {
    instr = '⊘ Tidak ikut — tidak ada transaksi'; klass = 'instr-skip'; badge = 'TIDAK IKUT';
  } else if (cfg.tipe === 'alokasi') {
    const cashR = bulatRp5(r.cash);
    if (cashR > 0) {
      const ket = r.net >= 0 ? `untung Rp ${numStr(r.net)}` : `rugi Rp ${numStr(-r.net)}`;
      instr = `✅ Bayar Rp ${cashR} ke ${nama} (${ket})`; klass = 'instr-pay'; badge = 'PAYOUT';
    } else {
      instr = '❌ Stake 100 hangus — tidak ada pembayaran'; klass = 'instr-lose'; badge = 'HANGUS';
    }
  } else if (r.status === 'SKIP') {
    instr = '⊘ Tidak ada transaksi'; klass = 'instr-skip'; badge = 'SKIP';
  } else if (r.status === 'NETRAL') {
    instr = `➖ Kembalikan stake Rp ${sub.wager} (netral)`; klass = 'instr-neutral'; badge = 'NETRAL';
  } else if (r.status.includes('IMPAS')) {
    instr = `➖ Kembalikan stake Rp ${sub.wager} (impas)`; klass = 'instr-neutral'; badge = r.status;
  } else if (r.status.includes('MENANG')) {
    instr = `✅ Bayar Rp ${bulatRp5(r.cash)} ke ${nama}`; klass = 'instr-pay'; badge = r.status;
  } else {
    instr = `❌ Stake Rp ${sub.wager} hangus — tidak ada pembayaran`; klass = 'instr-lose'; badge = r.status || 'KALAH';
  }
  return { r, instr, klass, badge };
}
function fmtNet(n) {
  const sign = n > 0 ? '+' : '';
  const cls = n > 0 ? 'net-pos' : n < 0 ? 'net-neg' : 'net-zero';
  // tampilkan presisi: hilangkan trailing .0 jika integer
  const str = Number.isInteger(n) ? n.toString() : n.toFixed(2);
  return `<span class="${cls}">${sign}${str}</span>`;
}

// Revisi 2: panel ringkasan instruksi Bankir untuk ronde aktif — hanya tim yang SUDAH ter-lock.
function renderSummary(rk, cfg) {
  const wrap = document.createElement('div');
  const panel = document.createElement('div');
  panel.className = 'banker';
  const subs = state.rounds[rk].submissions;

  let lines = '', count = 0;
  subs.forEach((sub, i) => {
    if (!sub.locked) return;   // tim belum lock di-skip
    count++;
    const bl = bankerLine(rk, cfg, sub, state.teams[i]);
    lines += `<div class="pay-line"><b>${escapeHtml(state.teams[i])}</b> → ` +
             `<span class="${bl.klass}">${escapeHtml(bl.instr)}</span></div>`;
  });

  panel.innerHTML = `<button class="close-reveal" id="closeReveal">Tutup</button>` +
    `<h3>Ringkasan Bankir — ${rk} (${count}/${NUM_TEAMS} ter-lock)</h3>` +
    (lines || `<div class="none">Belum ada tim ter-lock di ronde ini.</div>`);
  wrap.appendChild(panel);

  setTimeout(() => {
    const cb = document.getElementById('closeReveal');
    if (cb) cb.onclick = () => { summaryShown.delete(rk); render(); };
  }, 0);

  return wrap;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== LEADERBOARD PANEL (Phase 3) ===================== */
function renderLeaderboard() {
  const rows = hitungLeaderboard(state);
  // Revisi 2: final saat fase BONUS sudah 10 tim ter-lock+scored (lepas dari revealedPhases)
  const isFinal = allTeamsLocked('BONUS');

  const judul = isFinal ? 'RANKING FINAL — Oracle of Lyndell' : 'LEADERBOARD SEMENTARA';

  // Blok Top 3 (hanya saat final)
  let top3 = '';
  if (isFinal) {
    const gelar = ['🥇 Oracle of Lyndell', '🥈 Juara 2', '🥉 Juara 3'];
    top3 = '<div class="champs">';
    for (let r = 0; r < Math.min(3, rows.length); r++) {
      const t = rows[r];
      top3 += `<div class="champ champ-${r+1}">
        <div class="champ-gelar">${gelar[r]}</div>
        <div class="champ-nama">${escapeHtml(t.nama)}</div>
        <div class="champ-skor">${fmtNet(t.skorRanking)}</div>
      </div>`;
    }
    top3 += '</div>';
  }

  // Tabel ranking
  let trs = '';
  rows.forEach((t, idx) => {
    const warn = t.safetyNetTriggered
      ? `<span class="sn-flag" title="Safety Net: +Rp ${t.totalTopup}">⚠</span>` : '';
    trs += `<tr>
      <td class="lb-rank">${idx + 1}</td>
      <td class="lb-nama">${escapeHtml(t.nama)}</td>
      <td class="num">${fmtNet(t.skorRanking)}</td>
      <td class="num lb-kas">Rp ${t.kasBerjalan}</td>
      <td class="lb-sn">${warn}</td>
    </tr>`;
  });

  leaderboardEl.innerHTML = `
    <h2 class="lb-title ${isFinal ? 'final' : ''}">${judul}</h2>
    <div class="lb-sub">Skor terkini dari semua input ter-lock.</div>
    ${top3}
    <table class="lb-table">
      <thead><tr><th>#</th><th>Tim</th><th>Skor</th><th>Kas</th><th>⚠</th></tr></thead>
      <tbody>${trs}</tbody>
    </table>
    <div class="lb-note">Skor = net presisi (resmi, penentu juara). Kas = uang fisik bankir (bulat Rp 5, termasuk Safety Net). Dua angka terlacak terpisah.</div>
  `;
}

/* ===================== EXPORT / IMPORT / RESET (Phase 4) ===================== */
function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function downloadBlob(text, mime, filename) {
  const blob = new Blob([text], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Backup penuh: seluruh wp2-state -> file JSON.
function exportJson() {
  try {
    downloadBlob(JSON.stringify(state, null, 2), 'application/json', `wp2-backup-${stamp()}.json`);
  } catch (e) {
    alert('Export gagal: ' + e.message);
  }
}

// Audit log -> CSV (header: timestamp,action,phase,team,value).
function exportCsv() {
  const log = Array.isArray(state.auditLog) ? state.auditLog : [];
  const esc = v => `"${String(v).replace(/"/g, '""')}"`;
  let csv = 'timestamp,action,phase,team,value\n';
  for (const e of log) {
    csv += [esc(e.ts), esc(e.action), esc(e.phase), esc(e.team), esc(JSON.stringify(e.value))].join(',') + '\n';
  }
  downloadBlob(csv, 'text/csv', `wp2-audit-${stamp()}.csv`);
}

// Restore dari file JSON (dengan guard konfirmasi).
function importJson(file) {
  const reader = new FileReader();
  reader.onerror = () => alert('Gagal membaca file.');
  reader.onload = () => {
    let parsed;
    try { parsed = JSON.parse(reader.result); }
    catch (e) { alert('File tidak valid (gagal parse JSON).'); return; }

    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.teams) || !parsed.rounds || typeof parsed.rounds !== 'object') {
      alert('Struktur file tidak cocok (butuh field "teams" dan "rounds"). Import dibatalkan.');
      return;
    }
    if (!confirm('Import akan MENGGANTI semua data saat ini. Lanjut?')) return;   // GUARD WAJIB

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      state = loadState();                       // normalisasi + migrasi via merge defensif
      summaryShown.clear();
      pendingOverride.clear();
      pushAudit('IMPORT', '', '', { teams: state.teams.length, file: file.name });
      doSave();
      render();
      alert('Import berhasil.');
    } catch (e) {
      alert('Gagal import: ' + e.message);
    }
  };
  reader.readAsText(file);
}

// Reset terproteksi dua lapis.
function resetSemua() {
  if (!confirm('Yakin reset SEMUA data? Ini menghapus seluruh input, reveal, dan audit log.')) return;
  const ketik = prompt('Ketik HAPUS (huruf kapital) untuk konfirmasi reset:');
  if (ketik !== 'HAPUS') { alert('Reset dibatalkan.'); return; }
  state = defaultState();
  summaryShown.clear();
  pendingOverride.clear();
  pushAudit('RESET', '', '', null);
  doSave();
  render();
}

/* ===================== HOTKEYS (Phase 4) ===================== */
function focusRow(rk, i) {
  if (i < 0 || i >= NUM_TEAMS) return;
  const tr = mainEl.querySelector(`tr[data-team="${i}"]`);
  if (!tr) return;
  const f = tr.querySelector('select, input[type=number]');
  if (f && !f.disabled) f.focus();
}

document.addEventListener('keydown', (e) => {
  // Combo Ctrl/Cmd: aktif di mana saja (termasuk saat fokus di input)
  if (e.ctrlKey || e.metaKey) {
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); exportJson(); return; }
    if (k === 'l') { e.preventDefault(); lockAllValid(); return; }
    if (k === 'r') {
      e.preventDefault();
      toggleSummary(state.activeRound);   // non-gating
      return;
    }
    return;
  }

  // Enter: lock baris tempat fokus berada, lalu lompat ke baris berikut
  if (e.key === 'Enter') {
    const tr = e.target.closest && e.target.closest('tr[data-team]');
    if (tr && mainEl.contains(tr)) {
      e.preventDefault();
      const i = +tr.dataset.team;
      const rk = state.activeRound;
      if (lockTeam(rk, i)) { scheduleSave(); render(); focusRow(rk, i + 1); }
    }
  }
});

/* ===================== WIRING TOMBOL HEADER (Phase 4) ===================== */
document.getElementById('exportJsonBtn').onclick = exportJson;
document.getElementById('exportCsvBtn').onclick  = exportCsv;
document.getElementById('resetBtn').onclick      = resetSemua;
document.getElementById('importJsonBtn').onclick = () => document.getElementById('importFile').click();
document.getElementById('importFile').onchange   = (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importJson(f);
  e.target.value = '';   // reset agar memilih file sama lagi tetap memicu onchange
};
document.getElementById('helpBtn').onclick = () => {
  const h = document.getElementById('hotkeyHelp');
  h.hidden = !h.hidden;
};

/* ===================== INIT ===================== */
render();
</script>
